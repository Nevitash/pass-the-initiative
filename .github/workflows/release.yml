name: Release Foundry Module

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'release/')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: pass-the-initiative.zip

    steps:
      - name: Check out release branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Derive release tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TAG="${TAG#release/}-nightly"
            echo "IS_NIGHTLY=true" >> "$GITHUB_ENV"
          else
            TAG="${{ github.event.pull_request.head.ref }}"
            TAG="${TAG#release/}"
            echo "IS_NIGHTLY=false" >> "$GITHUB_ENV"
          fi
          if [[ "$TAG" != v* ]]; then
            echo "Release branches must use the format release/vX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build module
        run: npm run build

      - name: Create Foundry package
        shell: bash
        run: |
          mkdir package
          jq --arg version "${TAG#v}" \
            --arg download "https://github.com/Nevitash/pass-the-initiative/releases/download/${TAG}/${ZIP_NAME}" \
            '.version = $version | .download = $download' \
            module.json > package/module.json
          cp -r dist lang templates package/
          cd package
          zip -r "../${ZIP_NAME}" .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            if [[ "$IS_NIGHTLY" == "true" ]]; then
              gh release create "$TAG" "$ZIP_NAME" \
                --title "Pass the Initiative $TAG" \
                --prerelease \
                --generate-notes
            else
              gh release create "$TAG" "$ZIP_NAME" \
                --title "Pass the Initiative $TAG" \
                --generate-notes
            fi
          fi
